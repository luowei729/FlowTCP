[package]
name = "flowtcp-tls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "FlowTCP 的 TLS 1.3 握手层：Chrome 级指纹、首帧分流、exporter 密钥导出"

[dependencies]
flowtcp-proto = { path = "../flowtcp-proto" }
# BoringSSL 就是 Chrome 使用的 TLS 库，因此扩展集合天然与 Chrome 一致，
# 比自己拼 ClientHello 更可靠（见 PROJECT_PLAN 决策 #15）。
boring.workspace = true
# 异步握手封装（tokio-boring 提供 spawn_blocking 式的异步适配）
tokio-boring.workspace = true
# 临时自签证书（偷网站模式下服务端没有真网站私钥，只能现场生成）
rcgen.workspace = true
ed25519-dalek.workspace = true
p256.workspace = true
x25519-dalek.workspace = true
time.workspace = true
tokio.workspace = true
rand.workspace = true
sha2.workspace = true
hkdf.workspace = true
hmac.workspace = true
aes-gcm.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
