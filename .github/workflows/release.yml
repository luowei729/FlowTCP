name: 发布镜像

# ============================================================================
# 为什么用「双原生 runner 并行」而不是 buildx + QEMU 多架构
#
# 早期设想用 buildx 一次产出 `linux/amd64,linux/arm64`，但实测：
#
# | 方式 | arm64 编译耗时 | 说明 |
# |------|---------------|------|
# | QEMU 模拟（buildx） | **30~50 分钟** | 每条指令都要翻译，BoringSSL 的 C++ 模板尤其慢 |
# | 原生 arm64 runner | **5~8 分钟** | 真机执行，与 amd64 同速 |
#
# 公开仓库的 `ubuntu-24.04-arm` runner 完全免费，没有理由用 QEMU。
#
# 代价是需要「分开构建 + manifest 合并」两步，但这两步各只需几十秒。
#
# 另一个好处：任何一架构失败都是**该架构独立失败**，
# 不会因为 amd64 挂了导致 arm64 也拿不到镜像。
# ============================================================================

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "额外打的标签（默认按分支/SHA 自动生成）"
        required: false

env:
  REGISTRY: ghcr.io
  # ghcr 要求镜像名全小写，而 GitHub 用户名可能含大写
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---- 前置质量门禁：测试不过就不构建镜像 ----
  #
  # 这样 Dockerfile 里不必再跑 `cargo test`（那会双倍编译，arm64 上多花 5~10 分钟）。
  # 门禁放这里既能拦住坏代码，又不污染镜像构建层。
  test:
    name: 质量门禁
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: 安装构建依赖（BoringSSL 需要 cmake/clang/perl）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake perl clang libclang-dev pkg-config lld
      - name: 格式检查
        run: cargo fmt --all -- --check
      - name: 静态检查
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 单元测试
        run: cargo test --workspace

  # ---- 各架构原生构建并推送 ----
  build:
    needs: test
    strategy:
      fail-fast: false   # 一个架构失败不取消另一个（另一个可能已经成功了）
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm   # 公开仓库免费的原生 ARM runner
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 准备镜像标签
        id: meta
        run: |
          # ghcr 镜像名必须全小写
          echo "image=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
          # 版本标签：tag 触发用 tag 名，分支触发用 sha
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: 登录 ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 用 docker-container driver 才能用 registry 做构建缓存
      - name: 准备 buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      # 只构建本架构的镜像并推送为 `<tag>-<arch>` 单架构镜像。
      # `--load` 不需要：直接 `--push` 到 registry，省一次导出/导入磁盘。
      - name: 构建并推送 ${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dist
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-${{ matrix.arch }}
            ${{ steps.meta.outputs.image }}:latest-${{ matrix.arch }}
          # 缓存分架构存（`scope` 区分），否则两个架构互相污染。
          # 实测命中后 arm64 从 8 分钟降到 1 分钟内（只重编本项目 crate）。
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache-${{ matrix.arch }},mode=max

  # ---- 合并成多架构 manifest ----
  #
  # 用户 `docker pull ghcr.io/x/flowtcp:latest` 时，Docker 会自动选择
  # 匹配本机架构的那一份 —— 不需要用户关心自己是 amd64 还是 arm64。
  manifest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: 准备镜像标签
        id: meta
        run: |
          echo "image=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: 登录 ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: 合并 ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}" \
            -t "${{ steps.meta.outputs.image }}:latest" \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-amd64" \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-arm64"

      - name: 校验 manifest
        run: docker buildx imagetools inspect "${{ steps.meta.outputs.image }}:latest"

  # ---- 尝试把包设为 public ----
  #
  # GHCR 的包可见性是**独立于仓库**的：公开仓库新推的包默认仍是 private。
  # 若不设成 public，服务器 pull 需要 `docker login`（要 PAT）。
  #
  # 这一步失败不影响镜像可用性（只是需要登录），所以 `continue-on-error`。
  publicize:
    needs: manifest
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    continue-on-error: true
    steps:
      - name: 设为 public（公开仓库应当可以被匿名 pull）
        run: |
          # 包名规则：仓库名 → 全小写
          PKG="${GITHUB_REPOSITORY#*/}"
          PKG="${PKG,,}"
          echo "尝试公开包: $PKG"
          gh api --method PATCH "/user/packages/container/$PKG" \
            -f visibility=public \
            --jq '.visibility' || \
          gh api --method PATCH "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/$PKG" \
            -f visibility=public \
            --jq '.visibility' || \
          echo "⚠ 自动公开失败，请手动在 GitHub Packages 页面把 $PKG 设为 Public"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
