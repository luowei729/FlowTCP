# FlowTCP CI —— 质量门禁 + 多架构原生构建 + 镜像发布
#
# ============================================================================
# 三个关键决策（都是实测驱动，改之前先读）
#
# ① 一个 workflow，不是两个
#    早期拆成 ci.yml + release.yml，各自在 push:main 触发，结果每次提交
#    跑 **2 次测试 + 4 次编译**。合并后用 needs: 表达依赖。
#
# ② 各架构用**原生 runner**，不用 QEMU
#    | 方式 | arm64 耗时 |
#    |------|-----------|
#    | QEMU 模拟（单 job 多平台） | 30~50 分钟 |
#    | ubuntu-24.04-arm 原生 | 5~8 分钟 |
#    本项目的 BoringSSL 是 C++ 模板密集代码，QEMU 下尤其慢。
#
# ③ 用原生 `docker build`，**不用 buildx**
#    buildx（docker-container driver）要先起一个 buildkit 容器、把 build
#    context 传进去、再把产物导出回本地 daemon —— 单架构构建上这层开销很实在。
#    原生 `docker build` 直接走本地 daemon，层缓存即刻生效。
#    合并 manifest 用经典 `docker manifest`（不是构建，只是往 registry 写索引）。
#
#    YAML 结构：
#      fmt ──┐
#      clippy ├─→ image (amd64 ‖ arm64) → manifest → publicize
#      test ──┘
# ============================================================================
#
# 设计原则：
#   1. fmt / clippy / test 并行，快速失败；PR 只跑这三个
#   2. 产物是 OCI 镜像（多架构 manifest），服务器直接 pull
name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# 同一分支的新提交取消旧的运行，节省 CI 配额
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 带完整 backtrace，方便定位偶发 panic
  RUST_BACKTRACE: 1
  RUST_LOG: info
  REGISTRY: ghcr.io

jobs:
  # ==========================================================================
  # Job 1: 代码格式检查（最快，几秒）
  # ==========================================================================
  fmt:
    name: 格式检查 (rustfmt)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ==========================================================================
  # Job 2: Clippy 静态检查（把警告当错误）
  #
  # 为什么 -D warnings：警告长期积累会让真正的问题淹没在噪音里。
  # ==========================================================================
  clippy:
    name: 静态检查 (clippy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: 安装构建依赖（BoringSSL 需要 cmake/clang/perl）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake perl clang libclang-dev pkg-config lld
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # ==========================================================================
  # Job 3: 单元测试 + 端到端测试
  #
  # 这里是**唯一**跑测试的地方。镜像构建里刻意不跑 `cargo test`
  # （那会重新编译所有 crate 的 test profile，arm64 上多花大几分钟）。
  # ==========================================================================
  test:
    name: 单元测试
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake perl clang libclang-dev pkg-config lld
      - run: cargo test --workspace

  # ==========================================================================
  # Job 4: 各架构原生构建镜像并推送 ghcr
  #
  # runner 本身就是目标架构（amd64 runner 编 amd64、arm64 runner 编 arm64），
  # 所以 `docker build` 不需要 --platform，也不需要 QEMU —— 纯本机执行。
  # ==========================================================================
  image:
    name: 镜像 (${{ matrix.arch }})
    # PR 不构建镜像：PR 只需证明代码正确，不值得烧两架构的编译时间
    if: github.event_name != 'pull_request'
    needs: [fmt, clippy, test]
    strategy:
      fail-fast: false   # 一个架构失败不取消另一个（另一个可能已经成功）
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 准备标签
        id: meta
        run: |
          # ghcr 要求镜像名全小写（GitHub 用户名可能含大写）
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          # tag 推送用 tag 名，分支推送用短 SHA（便于回滚到具体提交）
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: 登录 ghcr
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      # ---- 构建 ----
      #
      # 缓存策略：把上一次推的 `cache-<arch>`（builder 阶段的镜像）拉下来
      # 当 `--cache-from`。原生 builder 会按层历史匹配，命中后
      # `cargo chef cook` 整段跳过 —— 这是「不用 buildx 也能跨运行缓存」
      # 的经典做法。
      #
      # 为什么缓存载体选 **builder 阶段** 而不是 dist：
      # dist 只含最后几层（基础镜像 + 二进制），编译层全都不在里面，
      # 拿它做 cache-from 几乎命中不了任何有效层。
      - name: 构建 ${{ matrix.arch }}
        env:
          IMG: ${{ steps.meta.outputs.image }}
          VER: ${{ steps.meta.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          # 拉缓存载体（首次构建必然没有，忽略失败）
          docker pull "$IMG:cache-$ARCH" || echo "无历史缓存，本次为首次构建"

          # ① 构建到 builder 阶段并推为缓存载体。
          #    有缓存时几乎瞬间完成，无缓存时就是完整依赖编译。
          docker build \
            --target builder \
            --cache-from "$IMG:cache-$ARCH" \
            -t "$IMG:cache-$ARCH" \
            .
          docker push "$IMG:cache-$ARCH"

          # ② 构建 dist：它的下两层就是刚构建好的 builder 层，
          #    本地 daemon 直接命中，只多花导出二进制的几秒。
          docker build \
            --target dist \
            --cache-from "$IMG:cache-$ARCH" \
            -t "$IMG:$VER-$ARCH" \
            -t "$IMG:latest-$ARCH" \
            .
          docker push "$IMG:$VER-$ARCH"
          docker push "$IMG:latest-$ARCH"

          # 打印实际架构，防止「以为编了 arm64 其实编了 amd64」
          docker image inspect "$IMG:$VER-$ARCH" \
            --format '  产物: os={{.Os}} arch={{.Architecture}} size={{.Size}}'

  # ==========================================================================
  # Job 5: 合并成多架构 manifest
  #
  # 用经典 `docker manifest`（不是构建，只是往 registry 写一个索引列表）。
  # 用户 `docker pull ghcr.io/x/flowtcp:latest` 时 Docker 会自动挑匹配本机
  # 架构的那一份，用户不需要知道自己是 amd64 还是 arm64。
  #
  # 架构信息由镜像 config 自动带出（原生构建记录的平台是正确的），
  # 因此不需要手工 `docker manifest annotate`。
  # ==========================================================================
  manifest:
    name: 合并 manifest
    if: github.event_name != 'pull_request'
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: 准备标签
        id: meta
        run: |
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: 登录 ghcr
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: 合并 ${{ steps.meta.outputs.version }}
        env:
          IMG: ${{ steps.meta.outputs.image }}
          VER: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          for TAG in "$VER" "latest"; do
            docker manifest create "$IMG:$TAG" \
              "$IMG:$VER-amd64" \
              "$IMG:$VER-arm64"
            # --purge：推送后删掉本地临时 manifest，避免下次 create 冲突
            docker manifest push --purge "$IMG:$TAG"
          done

      - name: 校验 manifest（两个架构都在才算成功）
        env:
          IMG: ${{ steps.meta.outputs.image }}
        run: |
          set -euo pipefail
          OUT=$(docker manifest inspect "$IMG:latest")
          echo "$OUT" | grep -q '"architecture": "amd64"' || { echo "✗ 缺 amd64"; exit 1; }
          echo "$OUT" | grep -q '"architecture": "arm64"' || { echo "✗ 缺 arm64"; exit 1; }
          echo "✓ manifest 含 amd64 + arm64"

  # ==========================================================================
  # Job 6: 把 GHCR 包设为 public
  #
  # GHCR 的包可见性是**独立于仓库**的：公开仓库新推的包默认仍是 private。
  # 不设成 public，服务器 pull 时需要 `docker login`（还得配 PAT）。
  #
  # 这一步失败不影响镜像可用性（只是需要登录），所以 continue-on-error。
  # ==========================================================================
  publicize:
    name: 设为 public
    if: github.event_name != 'pull_request'
    needs: manifest
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    continue-on-error: true
    steps:
      - name: 公开 GHCR 包（允许匿名 pull）
        run: |
          PKG="${GITHUB_REPOSITORY#*/}"
          PKG="${PKG,,}"
          echo "尝试公开包: $PKG"
          # 先试用户级（个人仓库），再试组织级
          gh api --method PATCH "/user/packages/container/$PKG" \
            -f visibility=public --jq '.visibility' \
          || gh api --method PATCH "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/$PKG" \
            -f visibility=public --jq '.visibility' \
          || echo "⚠ 自动公开失败，请手动在 GitHub Packages 页面把 $PKG 设为 Public"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
